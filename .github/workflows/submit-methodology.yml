name: Submit Methodology

on:
  repository_dispatch:
    types: [submit_methodology]

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Translate name to English
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-name-en
        with:
          text: ${{ github.event.client_payload.full_name }}
          target-language: "English"
          custom-instructions: "Translate the software methodology name. Keep it concise. Only output the translation, nothing else."

      - name: Translate name to Arabic
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-name-ar
        with:
          text: ${{ github.event.client_payload.full_name }}
          target-language: "Arabic"
          custom-instructions: "Translate the software methodology name. Keep it concise. Only output the translation, nothing else."

      - name: Translate name to Spanish
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-name-es
        with:
          text: ${{ github.event.client_payload.full_name }}
          target-language: "Spanish"
          custom-instructions: "Translate the software methodology name. Keep it concise. Only output the translation, nothing else."

      - name: Translate description to English
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-desc-en
        with:
          text: ${{ github.event.client_payload.description }}
          target-language: "English"
          custom-instructions: "Translate this software methodology description. Preserve the original tone and meaning. Only output the translation, nothing else."

      - name: Translate description to Arabic
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-desc-ar
        with:
          text: ${{ github.event.client_payload.description }}
          target-language: "Arabic"
          custom-instructions: "Translate this software methodology description. Preserve the original tone and meaning. Only output the translation, nothing else."

      - name: Translate description to Spanish
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-desc-es
        with:
          text: ${{ github.event.client_payload.description }}
          target-language: "Spanish"
          custom-instructions: "Translate this software methodology description. Preserve the original tone and meaning. Only output the translation, nothing else."

      - name: Translate resource labels to English JSON
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-resources-en
        with:
          text: ${{ toJson(github.event.client_payload.resources) }}
          target-language: "English"
          custom-instructions: "Input is a JSON array of objects with label and url keys. Return ONLY valid JSON array with same length/order/urls. Translate label values to English. Do not add markdown or commentary."

      - name: Translate resource labels to Arabic JSON
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-resources-ar
        with:
          text: ${{ toJson(github.event.client_payload.resources) }}
          target-language: "Arabic"
          custom-instructions: "Input is a JSON array of objects with label and url keys. Return ONLY valid JSON array with same length/order/urls. Translate label values to Arabic. Do not add markdown or commentary."

      - name: Translate resource labels to Spanish JSON
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate-resources-es
        with:
          text: ${{ toJson(github.event.client_payload.resources) }}
          target-language: "Spanish"
          custom-instructions: "Input is a JSON array of objects with label and url keys. Return ONLY valid JSON array with same length/order/urls. Translate label values to Spanish. Do not add markdown or commentary."

      - name: Create methodology file and prepare PR
        id: create-methodology
        env:
          METHOD_ACRONYM: ${{ github.event.client_payload.methodology_name }}
          METHOD_FULL_NAME: ${{ github.event.client_payload.full_name }}
          METHOD_DESC_SOURCE: ${{ github.event.client_payload.description }}
          METHOD_NAME_EN: ${{ steps.translate-name-en.outputs.translated-text }}
          METHOD_NAME_AR: ${{ steps.translate-name-ar.outputs.translated-text }}
          METHOD_NAME_ES: ${{ steps.translate-name-es.outputs.translated-text }}
          METHOD_DESC_EN: ${{ steps.translate-desc-en.outputs.translated-text }}
          METHOD_DESC_AR: ${{ steps.translate-desc-ar.outputs.translated-text }}
          METHOD_DESC_ES: ${{ steps.translate-desc-es.outputs.translated-text }}
          METHOD_AUTHOR: ${{ github.event.client_payload.author_name || github.event.client_payload.name }}
          METHOD_AUTHOR_URL: ${{ github.event.client_payload.author_url }}
          METHOD_RESOURCES_JSON: ${{ toJson(github.event.client_payload.resources) }}
          METHOD_RESOURCES_EN_JSON: ${{ steps.translate-resources-en.outputs.translated-text }}
          METHOD_RESOURCES_AR_JSON: ${{ steps.translate-resources-ar.outputs.translated-text }}
          METHOD_RESOURCES_ES_JSON: ${{ steps.translate-resources-es.outputs.translated-text }}
          METHOD_TYPE: ${{ github.event.client_payload.methodology_type }}
          METHOD_SOURCE_LANG: ${{ github.event.client_payload.source_lang }}
        run: |
          python << 'PY'
          import json
          import os
          import re
          from pathlib import Path

          acronym = os.environ["METHOD_ACRONYM"].strip()
          full_name = os.environ["METHOD_FULL_NAME"].strip()
          desc_source = os.environ["METHOD_DESC_SOURCE"].strip()
          name_en = os.environ["METHOD_NAME_EN"].strip()
          name_ar = os.environ["METHOD_NAME_AR"].strip()
          name_es = os.environ["METHOD_NAME_ES"].strip()
          desc_en = os.environ["METHOD_DESC_EN"].strip()
          desc_ar = os.environ["METHOD_DESC_AR"].strip()
          desc_es = os.environ["METHOD_DESC_ES"].strip()
          author = os.environ["METHOD_AUTHOR"].strip()
          author_url = os.environ.get("METHOD_AUTHOR_URL", "").strip()
          resources_raw = os.environ.get("METHOD_RESOURCES_JSON", "[]").strip()
          resources_en_raw = os.environ.get("METHOD_RESOURCES_EN_JSON", "[]").strip()
          resources_ar_raw = os.environ.get("METHOD_RESOURCES_AR_JSON", "[]").strip()
          resources_es_raw = os.environ.get("METHOD_RESOURCES_ES_JSON", "[]").strip()
          methodology_type = os.environ.get("METHOD_TYPE", "satire").strip().lower()
          source_lang = os.environ.get("METHOD_SOURCE_LANG", "en").strip()

          if methodology_type not in {"real", "satire"}:
              methodology_type = "satire"

          def safe_json(raw):
              try:
                  parsed = json.loads(raw) if raw else []
                  return parsed if isinstance(parsed, list) else []
              except (json.JSONDecodeError, TypeError):
                  return []

          parsed_resources = safe_json(resources_raw)
          parsed_resources_en = safe_json(resources_en_raw)
          parsed_resources_ar = safe_json(resources_ar_raw)
          parsed_resources_es = safe_json(resources_es_raw)

          resources = []
          for idx, item in enumerate(parsed_resources):
              if not isinstance(item, dict):
                  continue
              label = str(item.get("label", "")).strip()
              url = str(item.get("url", "")).strip()
              if not url or not re.match(r"^https?://", url, flags=re.IGNORECASE):
                  continue
              if not label:
                  label = url

              label_en = label
              if idx < len(parsed_resources_en) and isinstance(parsed_resources_en[idx], dict):
                  label_en = str(parsed_resources_en[idx].get("label", label)).strip() or label

              label_ar = label
              if idx < len(parsed_resources_ar) and isinstance(parsed_resources_ar[idx], dict):
                  label_ar = str(parsed_resources_ar[idx].get("label", label)).strip() or label

              label_es = label
              if idx < len(parsed_resources_es) and isinstance(parsed_resources_es[idx], dict):
                  label_es = str(parsed_resources_es[idx].get("label", label)).strip() or label

              resources.append({
                  "label_en": label_en,
                  "label_ar": label_ar,
                  "label_es": label_es,
                  "url": url,
              })

          resources = resources[:10]

          # Map source language to correct fields
          if source_lang == "ar":
              final_name_en = name_en
              final_name_ar = full_name
              final_name_es = name_es
              final_desc_en = desc_en
              final_desc_ar = desc_source
              final_desc_es = desc_es
          elif source_lang == "es":
              final_name_en = name_en
              final_name_ar = name_ar
              final_name_es = full_name
              final_desc_en = desc_en
              final_desc_ar = desc_ar
              final_desc_es = desc_source
          else:  # en or en-gb or unknown
              final_name_en = full_name
              final_name_ar = name_ar
              final_name_es = name_es
              final_desc_en = desc_source
              final_desc_ar = desc_ar
              final_desc_es = desc_es

          title = f"{acronym} - {final_name_en}"
          slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")
          file_path = Path("_methodologies") / f"{slug}.md"

          if file_path.exists():
              raise SystemExit(f"Methodology file already exists: {file_path}")

          def q(value):
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          def block(value):
              if not value:
                  return "  "
              return "\n".join(f"  {line}" for line in value.replace("\r\n", "\n").replace("\r", "\n").split("\n"))

          def to_en_gb(value):
              replacements = [
                  ("Behavior", "Behaviour"), ("behavior", "behaviour"),
                  ("Organize", "Organise"), ("organize", "organise"),
                  ("Organized", "Organised"), ("organized", "organised"),
                  ("Organizing", "Organising"), ("organizing", "organising"),
                  ("Organization", "Organisation"), ("organization", "organisation"),
                  ("Prioritized", "Prioritised"), ("prioritized", "prioritised"),
                  ("Optimize", "Optimise"), ("optimize", "optimise"),
                  ("Optimized", "Optimised"), ("optimized", "optimised"),
                  ("Optimizing", "Optimising"), ("optimizing", "optimising"),
                  ("Maximize", "Maximise"), ("maximize", "maximise"),
                  ("Minimize", "Minimise"), ("minimize", "minimise"),
                  ("Modeling", "Modelling"), ("modeling", "modelling"),
                  ("Modeled", "Modelled"), ("modeled", "modelled"),
                  ("Center", "Centre"), ("center", "centre"),
                  ("Color", "Colour"), ("color", "colour"),
                  ("Analyze", "Analyse"), ("analyze", "analyse"),
                  ("Standardization", "Standardisation"), ("standardization", "standardisation"),
                  ("Utilize", "Utilise"), ("utilize", "utilise"),
                  ("Visualize", "Visualise"), ("visualize", "visualise"),
              ]
              result = value
              for old, new in replacements:
                  result = result.replace(old, new)
              return result

          name_en_gb = to_en_gb(final_name_en)
          desc_en_gb = to_en_gb(final_desc_en)

          lines = [
              "---",
              "layout: methodology",
              f"title: {q(title)}",
              f"type: {q(methodology_type)}",
              f"acronym: {q(acronym)}",
              'acronym_ar: ""',
              f"acronym_es: {q(acronym)}",
              f"name_en: {q(final_name_en)}",
              f"name_en_gb: {q(name_en_gb)}",
              f"name_ar: {q(final_name_ar)}",
              f"name_es: {q(final_name_es)}",
              "description_en: >-",
              block(final_desc_en),
              "description_en_gb: >-",
              block(desc_en_gb),
              "description_ar: >-",
              block(final_desc_ar),
              "description_es: >-",
              block(final_desc_es),
              f"author: {q(author)}",
              f"author_en_gb: {q(author)}",
              f"author_ar: {q(author)}",
              f"author_es: {q(author)}",
              f"author_url: {q(author_url)}",
          ]

          if resources:
              lines.append("resources:")
              for r in resources:
                  lines.extend([
                      f"  - label: {q(r['label_en'])}",
                      f"    label_en_gb: {q(to_en_gb(r['label_en']))}",
                      f"    label_ar: {q(r['label_ar'])}",
                      f"    label_es: {q(r['label_es'])}",
                      f"    url: {q(r['url'])}",
                  ])

          lines.extend(["---", ""])

          content = "\n".join(lines)
          file_path.write_text(content, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"slug={slug}\n")
              out.write(f"method_file={file_path.as_posix()}\n")
          PY

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: add methodology ${{ github.event.client_payload.methodology_name }}"
          title: "New Methodology: ${{ github.event.client_payload.methodology_name }} - ${{ github.event.client_payload.full_name }}"
          body: |
            ## New Methodology Submission

            **Acronym:** ${{ github.event.client_payload.methodology_name }}
            **Full Name:** ${{ github.event.client_payload.full_name }}
            **Submitted by:** ${{ github.event.client_payload.name }} (${{ github.event.client_payload.email }})
            **Author:** ${{ github.event.client_payload.author_name || github.event.client_payload.name }}
            **Author URL:** ${{ github.event.client_payload.author_url || 'N/A' }}
            **Source Language:** ${{ github.event.client_payload.source_lang }}

            ### Description (source)
            ${{ github.event.client_payload.description }}

            ### Resources
            `${{ toJson(github.event.client_payload.resources) }}`

            ### Generated File
            `${{ steps.create-methodology.outputs.method_file }}`

            ### Translations (auto-generated)
            - **EN:** ${{ steps.translate-name-en.outputs.translated-text }}
            - **EN-GB:** (derived from EN)
            - **AR:** ${{ steps.translate-name-ar.outputs.translated-text }}
            - **ES:** ${{ steps.translate-name-es.outputs.translated-text }}

            ---
            *Auto-translated using [ai-translate-action](https://github.com/FidelusAleksander/ai-translate-action). Please review translations before merging.*
          branch: "methodology/${{ steps.create-methodology.outputs.slug }}"
          delete-branch: true
          labels: |
            new-methodology
            auto-translated
