name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: |
          echo "web3forms_key: \"$WEB3FORMS_KEY\"" > _config.secrets.yml
          echo "dispatch_token: \"$DISPATCH_TOKEN\"" >> _config.secrets.yml
          bundle exec jekyll build --verbose --config _config.yml,_config.secrets.yml
        env:
          JEKYLL_ENV: production
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
