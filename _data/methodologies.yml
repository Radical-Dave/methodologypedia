- slug: add-acronym
  acronym: ADD
  acronym_ar: "م.ا.ت"
  acronym_es: "ADD"
  name_en: "Acronym Driven Development"
  name_ar: "التطوير المبني بالاختصارات"
  name_es: "Desarrollo Impulsado por Acrónimos"
  description_en: >
    The HORSE of development methodologies; you consistently blame the failure of your last project on the fact that you picked the wrong methodology, and resolve to try something different on your next project. The conventional approach is to go test-driven, then behaviour-driven, then domain-driven, then extreme, then back to domain-driven. It's a very educational way of wasting your employer's time and money, and there's normally someone in a back room happily coding away who doesn't have the faintest idea what the rest of you are doing, but is probably shipping enough features to keep your company afloat.
  description_ar: >
    حُصْن منهجيات التطوير؛ أنت تلوم باستمرار على فشل مشروعك السابق لأنك اخترت المنهجية الخاطئة، وتقرر تجربة شيء مختلف في مشروعك القادم. النهج التقليدي هو الذهاب نحو التطوير المبني على الاختبارات، ثم التطوير المبني على السلوك، ثم التطوير المبني على النطاق، ثم التطوير المتطرف، ثم العودة للتطوير المبني على النطاق. إنها طريقة تعليمية جداً لتبديد وقت وأموال صاحب العمل، وهناك عادة شخص في غرفة مظلمة ي CODE بسعادة ولا يعرف أدنى فكرة عمليات تفعلونها، لكنه على الأرجح يُصدر ما يكفي من الميزات لإبقاء شركتك طافية.
  description_es: >
    El CABALLO de las metodologías de desarrollo; culpas consistentemente del fracaso de tu último proyecto al hecho de elegir la metodología equivocada, y decides probar algo diferente en tu próximo proyecto. El enfoque convencional es pasar al desarrollo guiado por pruebas, luego por comportamiento, luego por dominio, luego al extremo, y volver al dominio. Es una forma muy educativa de desperdiciar el tiempo y dinero de tu empleador, y normalmente hay alguien en una habitación trasera programando felizmente sin la menor idea de lo que el resto de ustedes están haciendo, pero probablemente está entregando suficientes funciones para mantener a flote tu empresa.
  author: ""

- slug: add-alcohol
  acronym: ADD
  acronym_ar: "م.ك.ت"
  acronym_es: "ADD"
  name_en: "Alcohol Driven Development"
  name_ar: "التطوير المبني بالكحول"
  name_es: "Desarrollo Impulsado por Alcohol"
  description_en: "The best way to write pragmatic code is under the influence."
  description_ar: "أفضل طريقة لكتابة كود عملي هي تحت تأثير الكحول."
  description_es: "La mejor manera de escribir código pragmático es bajo los efectos del alcohol."
  author: ""

- slug: add-agro
  acronym: ADD
  acronym_ar: "م.ع.ت"
  acronym_es: "ADD"
  name_en: "Agro Driven Development"
  name_ar: "التطوير المبني بالعداء"
  name_es: "Desarrollo Impulsado por Agresividad"
  description_en: "Developers code features directly proportional to the amount of heat they are getting from users, sales or managers."
  description_ar: "المطورون يبرمجون الميزات بما يتناسب مع كمية الضغط الذي يتلقونه من المستخدمين أو المبيعات أو المديرين."
  description_es: "Los desarrolladores codifican funciones directamente proporcionales a la cantidad de presión que reciben de usuarios, ventas o gerentes."
  author: ""

- slug: adddd
  acronym: ADDDD
  acronym_ar: "م.ن.ن.ت"
  acronym_es: "TDA"
  name_en: "Attention Deficit Disorder Driven Design"
  name_ar: "التصميم المبني باضطراب نقص الانتباه"
  name_es: "Diseño Impulsado por Trastorno por Déficit de Atención"
  description_en: >
    Most commonly seen in open-source projects. You begin by implementing a core feature. After a couple of days, when either it gets boring or you've coded yourself into a corner and can't work out how to get out, you pick a new feature and start implementing that one instead. Advantages of this approach are that you can tick "in development" on the feature comparison charts when evaluating your solution against the alternatives. Disadvantages are that it leads to crappy software that doesn't work.
  description_ar: >
    أكثر شيوعاً في مشاريع المصادر المفتوحة. تبدأ بتنفيذ ميزة أساسية. بعد بضعة أيام، سواء عندما يصبح مملاً أو عندما تجد نفسك في زاوية ولا تعرف كيف تخرج، تختار ميزة جديدة وتبدأ بتنفيذها بدلاً منها. مزايا هذه الطريقة هي أنك يمكنك تحديد "قيد التطوير" في جداول مقارنة الميزات عند تقييم حلولك مقارنة بالبدائل. عيوبها أنها تؤدي إلى برمجيات سيئة لا تعمل.
  description_es: >
    Más comúnmente visto en proyectos de código abierto. Comienzas implementando una función principal. Después de unos días, cuando se vuelve aburrida o te has programado en una esquina sin saber cómo salir, eliges una nueva función y comienzas a implementar esa en su lugar. Las ventajas de este enfoque es que puedes marcar "en desarrollo" en las tablas de comparación de funciones al evaluar tu solución contra las alternativas. Las desventajas es que lleva a software basura que no funciona.
  author: ""

- slug: adhddd
  acronym: ADHDDD
  acronym_ar: "م.ن.ن.ف.ت"
  acronym_es: "TDAH"
  name_en: "Attention Deficit Hyperactive Disorder Driven Development"
  name_ar: "التطوير المبني باضطراب نقص الانتباه وال hyperactivity"
  name_es: "Desarrollo Impulsado por Trastorno por Déficit de Atención e Hiperactividad"
  description_en: "Just like ADDDD, but features are only ever added in brief caffeine-fuelled bursts of manic coding, usually around 4am, accompanied by dozens of tweets, blog posts and Facebook status updates."
  description_ar: "مثل ADDDD تماماً، لكن الميزات تُضاف فقط في نوبات قصيرة مدعومة بالكافيين من البرمجة الهوسية، عادة حوالي الساعة 4 صباحاً، مصحوبة بعشرات التغريدات ومنشورات المدونة وتحديثات حالة فيسبوك."
  description_es: "Igual que ADDDD, pero las funciones solo se añaden en breves oleadas de codificación maníaca impulsadas por cafeína, generalmente alrededor de las 4am, acompañadas de docenas de tweets, publicaciones de blog y actualizaciones de estado de Facebook."
  author: ""

- slug: addndd
  acronym: AD&DDD
  acronym_ar: "م.أ.ت.ت"
  acronym_es: "ADyDDD"
  name_en: "Advanced Dungeons & Dragons Driven Development"
  name_ar: "التطوير المبني على الأقبية المتقدمة والتنانين"
  name_es: "Desarrollo Impulsado por Mazmorras y Dragones Avanzados"
  description_en: >
    Everyone sits around drinking Red Bull, eating Doritos, boasting about their accomplishments and pretending to be some sort of tenth-level software architect when deep down they're still not quite sure what a pointer is. A "dungeon master" (also known as a "project manager") occasionally rolls some dice or reads a Gartner report, and then tells them that their project has died. Then they do it all over again, once every couple of months, sometimes continuing well into middle age.
  description_ar: >
    الجميع يجلسون حول يشربون ريد بول، وياكلون دورitos، ويتفاخرون بإنجازاتهم ويتظاهرون بأنهم نوع من المعماري Software من المستوى العاشر بينما في الأعماق لا يزالون غير متأكدين تماماً مما هو المؤشر. يرمي "master dungeon" (المعروف أيضاً باسم "مدير المشروع") بعض النرد أحياناً أو يقرأ تقرير Gartner، ثم يخبرهم بأن مشروعهم قد مات. ثم يفعلون ذلك مرة أخرى، مرة كل بضعة أulos، أحياناً يستمر حتى منتصف العمر.
  description_es: >
    Todos se sientan alrededor bebiendo Red Bull, comiendo Doritos, jactándose de sus logros y pretendiendo ser algún tipo de arquitecto de software de nivel diez cuando en el fondo aún no están muy seguros de qué es un puntero. Un "director de mazmorras" (también conocido como "gerente de proyecto") ocasionalmente lanza algunos dados o lee un informe de Gartner, y luego les dice que su proyecto ha muerto. Luego lo vuelven a hacer todo de nuevo, una vez cada par de meses, a veces continuando hasta bien entrada la mediana edad.
  author: ""

- slug: bdd-buzzword
  acronym: BDD
  acronym_ar: "ت.ك.د"
  acronym_es: "BDD"
  name_en: "Buzzword Driven Design"
  name_ar: "التصميم المبني بالكلمات البارزة"
  name_es: "Diseño Impulsado por Palabras de Moda"
  description_en: "Project is redesigned and started from scratch every six months to include all of the latest buzzwords."
  description_ar: "يعاد تصميم المشروع والبدء من الصفر كل ستة شهور لتشمل جميع الكلمات البارزة الأخيرة."
  description_es: "El proyecto se rediseña y comienza desde cero cada seis meses para incluir todas las últimas palabras de moda."
  author: ""

- slug: cdd-christmas
  acronym: CDD
  acronym_ar: "ت.ك.د"
  acronym_es: "DDN"
  name_en: "Christmas Driven Design"
  name_ar: "التصميم المبني بالكريسماس"
  name_es: "Diseño Impulsado por Navidad"
  description_en: "Where you coded how you wished the language worked, rather than how it really works."
  description_ar: "حيث برمجت كما ت wished أن تعمل اللغة، بدلاً من كيف تعمل في الواقع."
  description_es: "Donde programaste como desearías que funcionara el lenguaje, en lugar de como realmente funciona."
  author: ""

- slug: cdd-clone
  acronym: CDD
  acronym_ar: "ت.ن.د"
  acronym_es: "DDC"
  name_en: "Clone Driven Design"
  name_ar: "التصميم المبني بالنسخ"
  name_es: "Diseño Impulsado por Clonación"
  description_en: "Features and design are achieved by cloning somebody else's product thereby removing the pesky overhead of having to come up with ideas of your own. Sure fire way to stay firmly behind the leader."
  description_ar: "تتحقق الميزات والتصميم عن طريق نسخ منتج شخص آخر مما يزيل التكلفة الإضافية المزعجة لابتكار أفكارك الخاصة. طريقة مؤكدة للبقاء بثبات خلف القائد."
  description_es: "Las funciones y el diseño se logran clonando el producto de otra persona, eliminando así la molestia de tener que idear tus propias ideas. Forma segura de mantenerse firmemente detrás del líder."
  author: ""

- slug: cdd-comment
  acronym: CDD
  acronym_ar: "ت.ت.د"
  acronym_es: "DDC"
  name_en: "Comment Driven Design"
  name_ar: "التصميم المبني بالتعليقات"
  name_es: "Diseño Impulsado por Comentarios"
  description_en: "Comment out code until it works!"
  description_ar: "علّق على الكود حتى يعمل!"
  description_es: "¡Comenta el código hasta que funcione!"
  author: ""

- slug: ddd-defect
  acronym: DDD
  acronym_ar: "ت.ع.د"
  acronym_es: "DDD"
  name_en: "Defect Driven Design"
  name_ar: "التصميم المبني بالعيوب"
  name_es: "Diseño Impulsado por Defectos"
  description_en: "Instead of wasting time on specification and testing, just ship stuff. When the users come to you with their pitchforks because it doesn't work right, you'll know exactly what to work on next."
  description_ar: "بدلاً من إضاعة الوقت في المواصفات والاختبارات، فقط أرسل الأشياء. عندما يأتي المستخدمون إليك بمناحل因为他们 لأنها لا تعمل بشكل صحيح، ستعرف بالضبط ما يجب العمل عليه التالي."
  description_es: "En lugar de desperdiciar tiempo en especificaciones y pruebas, simplemente entrega las cosas. Cuando los usuarios vengan a ti con horcas porque no funciona correctamente, sabrás exactamente en qué trabajar a continuación."
  author: ""

- slug: ddddd
  acronym: DDDDD
  acronym_ar: "ت.م.م.م.ت"
  acronym_es: "DDDDD"
  name_en: "Developer Developer Developer Driven Development"
  name_ar: "التطوير المبني بالمطور المطور المطور"
  name_es: "Desarrollo Impulsado por Desarrollador Desarrollador Desarrollador"
  description_en: "Instead of wasting time on specification and testing, just ship stuff. When the users come to you with their pitchforks because it doesn't work right, you'll know exactly what to work on next."
  description_ar: "بدلاً من إضاعة الوقت في المواصفات والاختبارات، فقط أرسل الأشياء. عندما يأتي المستخدمون إليك بمناحل لأنها لا تعمل بشكل صحيح، ستعرف بالضبط ما يجب العمل عليه التالي."
  description_es: "En lugar de desperdiciar tiempo en especificaciones y pruebas, simplemente entrega las cosas. Cuando los usuarios vengan a ti con horcas porque no funciona correctamente, sabrás exactamente en qué trabajar a continuación."
  author: ""

- slug: edd
  acronym: EDD
  acronym_ar: "ت.ا.د"
  acronym_es: "DDE"
  name_en: "Ergo Driven Design"
  name_ar: "التصميم المبني بالأرجو"
  name_es: "Diseño Impulsado por Ergo"
  description_en: >
    Projects are started twice a year, normally the week immediately after the popular DDD community event at Microsoft headquarters, and generally involves building something really ground-breaking like a wiki or a blog engine, just to "get your head around" all the amazing new stuff you've seen at DDD. You'll generally lose interest about two days after you put the code up on Github as a "pre-alpha technology demo", and then six months later you'll do the whole thing all over again.
  description_ar: >
    تبدأ المشاريع مرتين في السنة، عادة الأسبوع فوراً بعد حدث مجتمع DDD الشهير في مقر مايكروسوفت، وgenerally تتضمن بناء شيء حقاً رائد مثل wiki أو محرك مدونة، فقط لـ "تفهم" كل الأشياء المذهلة الجديدة التي شاهدتها في DDD. ستفقد الاهتمام عادة بعد يومين من وضع الكود على Github كـ "عرض تكنولوجي ما قبل ألفا"، ثم بعد ستة شهور ستفعل كل شيء مرة أخرى.
  description_es: >
    Los proyectos comienzan dos veces al año, normalmente la semana inmediatamente después del popular evento comunitario DDD en la sede de Microsoft, y generalmente implica construir algo realmente innovador como un wiki o un motor de blog, solo para "entender" todas las cosas nuevas e impresionantes que has visto en DDD. Generalmente pierdes el interés unos dos días después de poner el código en Github como una "demo tecnológica pre-alfa", y luego seis meses después haces todo de nuevo.
  author: ""

- slug: exdd
  acronym: ExDD
  acronym_ar: "ت.ا.ت"
  acronym_es: "ExDD"
  name_en: "Exception Driven Development"
  name_ar: "التطوير المبني بالاستثناء"
  name_es: "Desarrollo Impulsado por Excepciones"
  description_en: "90% of the code is in catch statements."
  description_ar: "90% من الكود في جمل التقاط الأخطاء."
  description_es: "El 90% del código está en sentencias catch."
  author: ""

- slug: fdd-faith
  acronym: FDD
  acronym_ar: "ت.ا.ت"
  acronym_es: "DDF"
  name_en: "Faith Driven Development"
  name_ar: "التطوير المبني بالإيمان"
  name_es: "Desarrollo Impulsado por Fe"
  description_en: "Throw it over the fence and pray."
  description_ar: "ارمِه فوق السياج وصلِّ."
  description_es: "Tíralo por encima de la cerca y reza."
  author: ""

- slug: fdd-faith2
  acronym: FAITH
  acronym_ar: "إيمان"
  acronym_es: "FE"
  name_en: "FAITH Driven Development"
  name_ar: "التطوير المبني by FAITH"
  name_es: "Desarrollo Impulsado por FAITH"
  description_en: "Frequent Agile Iterative Tested by Heroes."
  description_ar: " متكررة تكرارية حرة تم اختبارها من قبل الأبطال."
  description_es: "Frecuente Ágil Iterativa Probada por Héroes."
  author: "David Walker"
  author_url: "http://www.davidlwalker.com/"

- slug: gdd
  acronym: GDD
  acronym_ar: "ت.غ.د"
  acronym_es: "DDG"
  name_en: "Golf Driven Design"
  name_ar: "التصميم المبني بالغولف"
  name_es: "Diseño Impulsado por Golf"
  description_en: "Where features and specifications are agreed on the golf course by people who neither use the software nor are responsible for implementing it but want to write off the whole trip as a business expense. With any luck they won't check the final product."
  description_ar: "حيث يتم الاتفاق على الميزات والمواصفات في ملعب الغولف من قبل أشخاص لا يستخدمون البرمجيات ولا مسؤولون عن تنفيذها لكنهم يريدون احتساب الرحلة كلها كمصروف تجاري. مع أي حظ لن يتحققوا من المنتج النهائي."
  description_es: "Donde las funciones y especificaciones se acuerdan en el campo de golf por personas que ni usan el software ni son responsables de implementarlo pero quieren deducir todo el viaje como gasto empresarial. Con suerte no revisarán el producto final."
  author: ""

- slug: hdd-hack
  acronym: HDD
  acronym_ar: "ت.ق.ت"
  acronym_es: "DDH"
  name_en: "Hack Driven Development"
  name_ar: "التطوير المبني بالقرصنة"
  name_es: "Desarrollo Impulsado por Hackeos"
  description_en: "Code looks like spaghetti. Every change in a program is a hack and can be made only by original author."
  description_ar: "الكود يبدو như معكرونة. كل تغيير في البرنامج هو حيلة ولا يمكن إجراؤه إلا من قبل المؤلف الأصلي."
  description_es: "El código parece espaguetis. Cada cambio en un programa es un hackeo y solo puede ser realizado por el autor original."
  author: ""

- slug: hdd-home
  acronym: HDD
  acronym_ar: "ت.م.ت"
  acronym_es: "DDH"
  name_en: "Home Driven Development"
  name_ar: "التطوير المبني بالمنزل"
  name_es: "Desarrollo Impulsado por el Hogar"
  description_en: "Do whatever it takes to get the job done and go home not in crazy hours, where all the real fun programming begins."
  description_ar: "افعل ما يلزم لإتمام العمل والعودة للمنزل وليس في ساعات جنونية، حيث تبدأ جميع متعة البرمجة الحقيقية."
  description_es: "Haz lo que sea necesario para terminar el trabajo y ve a casa no en horas locas, donde comienza toda la verdadera diversión de programar."
  author: ""

- slug: hdd-hype
  acronym: HDD
  acronym_ar: "ت.ض.ت"
  acronym_es: "DDH"
  name_en: "Hype Driven Development"
  name_ar: "التطوير المبني بالضجة"
  name_es: "Desarrollo Impulsado por Publicidad"
  description_en: "Nobody is sure of what the requirements are, or why the project started – but you're gonna code in the hot new language of the week, use the coolest framework of all time or have it running in no time on the hippest flavour of Linux, or all of the above."
  description_ar: "لا أحد متأكد مما هي المتطلبات، أو لماذا بدأ المشروع – لكنك ستبرمج بلغة الأسبوع الساخنة الجديدة، وتستخدم أكثر أطر العمل روعة على الإطلاق أو تشغّله في غضون وقت قصير على أكثر نكهة Linux رائجة، أو كل ما سبق."
  description_es: "Nadie está seguro de cuáles son los requisitos, o por qué comenzó el proyecto – pero vas a programar en el nuevo lenguaje caliente de la semana, usar el framework más genial de todos los tiempos o tenerlo funcionando en poco tiempo en la versión más popular de Linux, o todo lo anterior."
  author: ""

- slug: ldd
  acronym: LDD
  acronym_ar: "ت.غ.د"
  acronym_es: "DDA"
  name_en: "Lunch Driven Design"
  name_ar: "التصميم المبني بالغداء"
  name_es: "Diseño Impulsado por Almuerzo"
  description_en: "Where features, goals and APIs are decided over lunch by the developers and users who care enough to meet up over their lunch-time. Lunch must not be provided or you stray into Golf Driven Design instead."
  description_ar: "حيث يتم تحديد الميزات والأهداف وواجهات البرمجة خلال الغداء من قبل المطورين والمستخدمين الذين يهتمون بما يكفي للقاء خلال وقت غدائهم. يجب ألا يُقدم الغداء وإلا ستنتقل إلى تصميم الغولف بدلاً من ذلك."
  description_es: "Donde las funciones, objetivos y APIs se deciden durante el almuerzo por los desarrolladores y usuarios que se preocupan lo suficiente para reunirse en su hora de almuerzo. No se debe proporcionar almuerzo o terminarás en Diseño Impulsado por Golf."
  author: ""

- slug: pdd-panic
  acronym: PDD
  acronym_ar: "ت.ذ.ت"
  acronym_es: "DDP"
  name_en: "Panic Driven Development"
  name_ar: "التطوير المبني بالذعر"
  name_es: "Desarrollo Impulsado por Pánico"
  description_en: "All the developers are panicked because of the tight deadlines. And because of this panic and rush they create more bugs and become more panicked. Usually this follows the YDD."
  description_ar: "جميع المطورين في حالة ذعر بسبب المواعيد النهائية الضيقة. وسبب هذا الذعر والهرج يخلقون المزيد من الأخطاء ويزداد ذعراً. عادة ما يلي ذلك YDD."
  description_es: "Todos los desarrolladores están en pánico debido a los plazos ajustados. Y debido a este pánico y prisa crean más errores y se ponen más nerviosos. Generalmente esto sigue al YDD."
  author: ""

- slug: pdd-psychic
  acronym: PDD
  acronym_ar: "ت.ن.ت"
  acronym_es: "DDP"
  name_en: "Psychic Driven Development"
  name_ar: "التطوير المبني بالWaref"
  name_es: "Desarrollo Impulsado por Psíquico"
  description_en: "Where specifications are not so much decided through real communication but rather obtained via a psychic link with potential users with mixed results. Often seen in conjunction with Ego Driven Design."
  description_ar: "حيث لا يتم تحديد المواصفات من خلال التواصل الفعلي بقدر ما يتم الحصول عليها عبر رابط نفسي مع المستخدمين المحتملين بنتائج متباينة. غالباً ما يُرى بالاقتران مع تصميم الغرور."
  description_es: "Donde las especificaciones no se deciden tanto a través de comunicación real sino que se obtienen a través de un enlace psíquico con usuarios potenciales con resultados mixtos. A menudo se ve junto con Diseño Impulsado por Ego."
  author: ""

- slug: qdd
  acronym: QDD
  acronym_ar: "ت.ا.ت"
  acronym_es: "DDC"
  name_en: "Query Driven Development"
  name_ar: "التطوير المبني بالاستعلام"
  name_es: "Desarrollo Impulsado por Consultas"
  description_en: "Every page or screen starts with a question to the user what they want to see, writing that as a SQL/LINQ query statement and then dumping results out via a simple UI. Would likely be better off in Access or Excel but people involved want to claim they have intraweb experience."
  description_ar: "كل صفحة أو شاشة تبدأ بسؤال المستخدم عما يريد رؤيته، وكتابته كعبارة استعلام SQL/LINQ ثم عرض النتائج عبر واجهة مستخدم بسيطة. على الأرجح سيكون أفضل في Access أو Excel لكن الأشخاص المعنيين ي يريدون الادعاء بخبرة إنترابيت."
  description_es: "Cada página o pantalla comienza con una pregunta al usuario sobre qué quiere ver, escribiéndolo como una sentencia de consulta SQL/LINQ y luego mostrando los resultados a través de una UI simple. Probablemente sería mejor en Access o Excel pero las personas involucradas quieren afirmar que tienen experiencia en intraweb."
  author: ""

- slug: rdd
  acronym: RDD
  acronym_ar: "ت.ع.ت"
  acronym_es: "DDA"
  name_en: "Randomly Driven Development"
  name_ar: "التطوير المبني بشكل عشوائي"
  name_es: "Desarrollo Impulsado Aleatoriamente"
  description_en: "Requirements are defined and re-defined randomly with no thought to end-user expectations, needs or simple common sense. Often closely related to EDD."
  description_ar: "يتم تعريف المتطلبات وإعادة تعريفها بشكل عشوائي دون مراعاة توقعات المستخدم النهائي أو احتياجه أو الحس السليم البسيط. غالباً ما يكون مرتبطاً ارتباطاً وثيقاً بـ EDD."
  description_es: "Los requisitos se definen y redefinen aleatoriamente sin pensar en las expectativas, necesidades o simple sentido común del usuario final. A menudo estrechamente relacionado con EDD."
  author: ""

- slug: tdd-tea
  acronym: TDD
  acronym_ar: "ت.ش.ت"
  acronym_es: "DDT"
  name_en: "Tea Driven Development"
  name_ar: "التطوير المبني بالشاي"
  name_es: "Desarrollo Impulsado por Té"
  description_en: "A Tea based approach to developing computer software; The belief that software is best developed in an environment where there is plenty of Tea."
  description_ar: "نهج يعتمد على الشاي لتطوير البرمجيات؛ الإيمان بأن البرمجيات يتم تطويرها بشكل أفضل في بيئة يكون فيها الشاي بوفير."
  description_es: "Un enfoque basado en el té para desarrollar software de computadora; La creencia de que el software se desarrolla mejor en un ambiente donde hay mucho té."
  author: "Daniel Flippance"
  author_url: "http://www.danielflippance.com/blog/09-02-24/TDD_-_Tea_Driven_Development.aspx"

- slug: vdd
  acronym: VDD
  acronym_ar: "ت.ب.ت"
  acronym_es: "DDV"
  name_en: "Vapor Driven Development"
  name_ar: "التطوير المبني بالبخار"
  name_es: "Desarrollo Impulsado por Vapor"
  description_en: "Pre-announced projects often used together with CDD to take the wind out of competitors releases. More and more features are added with no real release date in sight. See Duke Nukem Forever for the canonical example."
  description_ar: "المشاريع المعلنة مسبقاً تُستخدم غالباً مع CDD لحرمان المنافسين من الزخم. تُضاف ميزات أكثر فأكثر دون تاريخ إصدار حقيقي في الأفق. راجع Duke Nukem Forever للنموذج التقليدي."
  description_es: "Proyectos pre-anunciados a menudo usados junto con CDD para quitar el viento a los lanzamientos de competidores. Cada vez se añaden más funciones sin una fecha de lanzamiento real a la vista. Consulta Duke Nukem Forever para el ejemplo canónico."
  author: ""

- slug: xdd
  acronym: XDD
  acronym_ar: "ت.غ.ت"
  acronym_es: "DDX"
  name_en: "Xenophobic Driven Development"
  name_ar: "التطوير المبني بالxenophobia"
  name_es: "Desarrollo Impulsado por Xenofobia"
  description_en: "Where the majority of development time is given over to making sure others can't do anything BUT what the original developers wanted. Typically observed by large sets of exception messages, the absence of hooks and a sprinkling of the sealed keyword."
  description_ar: "حيتم تخصيص الجزء الأكبر من وقت التطوير للتأكد من أن الآخرين لا يمكنهم فعل أي شيء سوى ما أراده المطورون الأصليون. يُلاحظ عادة بمجموعات كبيرة من رسائل الاستثناء، وغياب خطافات، ورشة من كلمة sealed."
  description_es: "Donde la mayor parte del tiempo de desarrollo se dedica a asegurar que otros no puedan hacer NADA excepto lo que los desarrolladores originales querían. Típicamente se observa con grandes conjuntos de mensajes de excepción, ausencia de hooks y un toque de la palabra clave sealed."
  author: ""

- slug: ydd
  acronym: YDD
  acronym_ar: "ت.أ.ت"
  acronym_es: "DDY"
  name_en: "Yesterday Driven Development"
  name_ar: "التطوير المبني بالأمس"
  name_es: "Desarrollo Impulsado por Ayer"
  description_en: "Features added today are the ones the customers thought they were getting yesterday. Generally used in very-tight rapid methodologies."
  description_ar: "الميزات المضافة اليوم هي تلك التي اعتقد العملاء أنهم سيحصلون عليها بالأمس. تُستخدم عموماً في منهجيات سريعة جداً ضيقة."
  description_es: "Las funciones añadidas hoy son las que los clientes pensaban que iban a obtener ayer. Generalmente se usa en metodologías rápidas y muy ajustadas."
  author: ""

- slug: zdd
  acronym: ZDD
  acronym_ar: "ت.ن.ت"
  acronym_es: "DDZ"
  name_en: "Zzzzz Driven Development"
  name_ar: "التطوير المبني bằng الزحف"
  name_es: "Desarrollo Impulsado por Zzzzz"
  description_en: "Every waking hour is given over to the development process at the expense of quality and design ideas that are only appreciated by the sleep-deprived. Normally observed on tight schedules such as those in the gaming industry."
  description_ar: "كل ساعة مستيقظة تُكرس لعملية التطوير على حساب الجودة وأفكار التصميم التي لا يقدرها إلا منحرمون من النوم. عادة ما يُلاحظ في المواعيد النهائية الضيقة مثل تلك في صناعة الألعاب."
  description_es: "Cada hora despierta se dedica al proceso de desarrollo a expensas de la calidad y las ideas de diseño que solo aprecian los privados de sueño. Normalmente se observa en cronogramas ajustados como los de la industria del gaming."
  author: ""
